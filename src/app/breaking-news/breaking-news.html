@if (connector != null) {
    <div id="container">
        <h3>BREAKING NEWS</h3>
        @for(info of connector.breakingNews(); track info) {
            <div class="breaking-news-item severity-{{ info.severity }}" >
                <span class="location color-{{ info.city?.cityColor }}">{{ (info.city ? info.city.name : "WORLD") | uppercase }} </span>
                <span class="text">{{ info.text }} </span>
                @if (info.icon != null) {
                    <i class="icon bi bi-{{ info.icon }}"></i>
                }
            </div >
        }
    </div>
}
