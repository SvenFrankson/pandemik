@if (player() != null) {
    <div class="avatar"></div>
    <div class="name">{{ player()!.name | uppercase }}</div>
    <div class="ap-icon" [class.available]="player()!.availableAPs() >= 1"></div>
    <div class="ap-icon" [class.available]="player()!.availableAPs() >= 2"></div>
    <div class="ap-icon" [class.available]="player()!.availableAPs() >= 3"></div>
    <div class="ap-icon" [class.available]="player()!.availableAPs() >= 4"></div>
}
